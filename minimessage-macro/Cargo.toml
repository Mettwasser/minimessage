[package]
name = "minimessage-macro"
version = "0.1.0"
edition = "2024"

[lib]
proc-macro = true

[dependencies]
fastsnbt = "0.2.1"
heck = "0.5.0"
minimessage-impl = { path = "../minimessage-impl" }
proc-macro2 = "1.0.107"
quote = "1.0.47"
serde = { version = "1.0.229", features = ["derive"] }
strum = { version = "0.28.0", features = ["derive"] }
syn = { version = "3.0.3", features = ["full"] }
